[pytest]
# Run pytest from the project root. This tells it where the tests live and
# adds the project root to sys.path so `from backend.app.main import app`
# resolves without any PYTHONPATH gymnastics.
testpaths = backend/tests
pythonpath = .

# -v          verbose: show each test name and its result
# --strict-markers  typo'd markers become errors instead of silent no-ops
addopts = -v --strict-markers