# nginx server for the ITBIS console (Module 13).
#
# Two responsibilities:
#   1. Serve the single-page app, falling back to index.html so client-side
#      routes (e.g. /reports, /investigations/AAM0658) load on refresh.
#   2. Reverse-proxy /api to the backend container, so the browser talks to one
#      origin and there is no CORS to configure.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets nginx serves.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 1. SPA routing: try the file, then a directory, then hand back index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. API reverse proxy. "backend" is the compose service name; Docker's
    #    internal DNS resolves it to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation can take a moment; don't cut long downloads short.
        proxy_read_timeout 120s;
    }
}
